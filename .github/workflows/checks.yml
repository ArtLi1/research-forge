name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: researchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: researchforge_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:isolated-test-password@127.0.0.1:5432/researchforge_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
