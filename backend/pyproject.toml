[project]
name = "research-forge-backend"
version = "0.2.0"
description = "ResearchForge API and background worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  "chromadb>=1.5,<2",
  "fastapi>=0.140,<1",
  "langgraph>=1.0,<2",
  "openai>=2.30,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "pymupdf>=1.28,<2",
  "pymupdf4llm>=1.28,<2",
  "python-multipart>=0.0.22,<1",
  "redis>=8.0,<9",
  "rq>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "socksio>=1.0,<2",
  "structlog>=26.1,<27",
  "tiktoken>=0.13,<1",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21",
  "httpx>=0.28",
  "mypy>=2.3",
  "pytest>=9.0",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["alembic"]
